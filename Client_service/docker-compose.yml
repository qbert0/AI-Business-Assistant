services:
  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CLIENT_SERVICE_CONTAINER_NAME:-client_app}
    ports:
      - "${CLIENT_SERVICE_PORT:-8501}:80"
    environment:
      NUXT_BACKEND_API_BASE_URL: ${NUXT_BACKEND_API_BASE_URL:-http://localhost:8000}
      NUXT_PUBLIC_BACKEND_API_BASE_URL: ${NUXT_PUBLIC_BACKEND_API_BASE_URL:-http://localhost:8000}
      NUXT_RAG_SERVICE_BASE_URL: ${NUXT_RAG_SERVICE_BASE_URL:-http://api-gateway/rag}
      NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${NUXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${CLIENT_JWT_SECRET:-local-dev-secret-change-me}
    depends_on:
      - server_service
      - rag-service
      - api-gateway
    restart: unless-stopped
