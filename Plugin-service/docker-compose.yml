services:
  plugin-service:
    image: nginx:1.27-alpine
    container_name: ${PLUGIN_SERVICE_CONTAINER_NAME:-plugin_service_app}
    ports:
      - "${PLUGIN_SERVICE_PORT:-8002}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./client.html:/usr/share/nginx/html/client.html:ro
    restart: unless-stopped
