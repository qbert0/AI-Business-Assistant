<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; background: white; border-radius: 12px; overflow: hidden; }
        .header { background: #0084ff; color: white; padding: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
        .msg.bot { background: #f0f2f5; color: #1c1e21; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.user { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .input-area { padding: 12px; border-top: 1px solid #e4e6eb; display: flex; gap: 8px; }
        input { flex: 1; padding: 10px 14px; border: 1px solid #ccd0d5; border-radius: 20px; outline: none; }
        button.send { background: #0084ff; color: white; border: none; padding: 0 16px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .loading { font-size: 12px; color: #65676B; align-self: flex-start; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <span>🤖 AI Assistant</span>
        <button class="close-btn" onclick="closeChat()">✕</button>
    </div>
    
    <div class="messages" id="chat-box">
        <div class="msg bot">Chào bạn! Mình có thể giúp gì cho bạn hôm nay?</div>
    </div>
    <div class="loading" id="loading-indicator">AI đang gõ...</div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Nhập tin nhắn..." onkeypress="if(event.key === 'Enter') send()">
        <button class="send" onclick="send()">Gửi</button>
    </div>

    <script>
        // Lấy API Key từ URL do plugin truyền vào
        const apiKey = new URLSearchParams(window.location.search).get('key');
        const baseUrl = window.location.origin; // Sẽ là http://localhost:8000

        async function send() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMsg(text, 'user');
            input.value = '';
            
            const loading = document.getElementById('loading-indicator');
            loading.style.display = 'block';

            try {
                const res = await fetch(`${baseUrl}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
                    body: JSON.stringify({ question: text })
                });
                
                const data = await res.json();
                loading.style.display = 'none';
                
                if(data.error) {
                    appendMsg("Lỗi: " + data.error, 'bot');
                } else {
                    appendMsg(data.answer, 'bot');
                }
            } catch (err) {
                loading.style.display = 'none';
                appendMsg("Không thể kết nối đến server.", 'bot');
            }
        }

        function appendMsg(text, type) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function closeChat() {
            // Gửi tín hiệu ra cửa sổ trình duyệt mẹ để ẩn iframe
            window.parent.postMessage('close-chat', '*');
        }
    </script>
</body>
</html>
