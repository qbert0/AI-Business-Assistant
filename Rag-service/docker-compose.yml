services:
  neo4j:
    image: ${RAG_NEO4J_IMAGE:-neo4j:5.26.0}
    container_name: ${RAG_NEO4J_CONTAINER_NAME:-rag_neo4j}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${RAG_NEO4J_AUTH:-neo4j/pleaseletmein}
      NEO4J_PLUGINS: ${RAG_NEO4J_PLUGINS:-["apoc"]}
      NEO4J_server_memory_heap_initial__size: ${RAG_NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${RAG_NEO4J_HEAP_MAX:-512m}
    ports:
      - "${RAG_NEO4J_HTTP_PORT:-7474}:7474"
      - "${RAG_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - rag_neo4j_data:/data
      - rag_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${RAG_SERVICE_CONTAINER_NAME:-rag_service_app}
    restart: unless-stopped
    command: ["python", "main.py"]
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${RAG_SERVICE_PORT:-8003}:8000"
    volumes:
      - .:/app
    depends_on:
      neo4j:
        condition: service_healthy

  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${RAG_WORKER_CONTAINER_NAME:-rag_worker_app}
    restart: unless-stopped
    command: ["python", "worker_main.py"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  rag_neo4j_data:
  rag_neo4j_logs:
