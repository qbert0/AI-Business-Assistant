[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service"
version = "0.1.0"
description = "RAG service for AI Business Assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "graphiti-core>=0.17.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "neo4j>=5.20.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "PyYAML>=6.0,<7.0",
    "loguru>=0.7.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "redis>=5.0.0,<6.0.0",
    "tenacity>=9.0.0,<10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
rag-service = "main:cli"
rag-worker = "worker_main:cli"

[tool.setuptools]
py-modules = ["main", "worker_main"]

[tool.setuptools.packages.find]
include = ["conn*", "services*", "utils*"]
