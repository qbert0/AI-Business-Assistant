  server_service:
    build:
      context: ./Server_service
      dockerfile: Dockerfile
    container_name: server_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://precisioncast:precisioncast123@mariadb:3306/precisioncast
      - JWT_SECRET_KEY=change-this-local-dev-secret
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - ./Server_service:/app
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
