include:
  - ./Database-service/docker-compose.yml
  - ./Search-service/docker-compose.yml

services:
  web-frontend:
    build:
      context: ./Client_service
      dockerfile: Dockerfile
    container_name: client_app
    ports:
      - "8501:80"
    environment:
      - NUXT_BACKEND_API_BASE_URL=http://server_service:8000
    depends_on:
      - server_service
    restart: unless-stopped

  server_service:
    build:
      context: ./Server_service
      dockerfile: Dockerfile
    container_name: server_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://precisioncast:precisioncast123@mariadb:3306/precisioncast
      - JWT_SECRET_KEY=change-this-local-dev-secret
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=business-documents
      - MINIO_SECURE=false
    volumes:
      - ./Server_service:/app
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
  minio_data:
