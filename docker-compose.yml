  #     context: ./Client_service
  #     dockerfile: Dockerfile
  #   container_name: client_app
  #   ports:
  #     - "8501:8501"
  #   volumes:
  #     - ./Client_service:/app
  #   depends_on:
  #     - server_service

  mariadb:
    image: mariadb:10.11
    container_name: precisioncast-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=precisioncast
      - MYSQL_USER=precisioncast
      - MYSQL_PASSWORD=precisioncast123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./Database-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  model_mariadb:
    image: mariadb:10.11
    container_name: model-service-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=modelrootpassword
      - MYSQL_DATABASE=model_service
      - MYSQL_USER=model_service
      - MYSQL_PASSWORD=model_service123
    ports:
      - "3307:3306"
    volumes:
      - model_mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  server_service:
    build:
      context: ./Server_service
      dockerfile: Dockerfile
    container_name: server_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://precisioncast:precisioncast123@mariadb:3306/precisioncast
      - JWT_SECRET_KEY=change-this-local-dev-secret
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MODEL_SERVICE_URL=http://model_service:8100
    volumes:
      - ./Server_service:/app
    depends_on:
      mariadb:
        condition: service_healthy
      model_service:
        condition: service_started

  model_service:
    build:
      context: ./Model_service
      dockerfile: Dockerfile
    container_name: model_service_app
    ports:
      - "8100:8100"
    environment:
      - DATABASE_URL=mysql+pymysql://model_service:model_service123@model_mariadb:3306/model_service
      - MODEL_SERVICE_SECRET_KEY=change-this-model-service-secret
      - MODEL_SERVICE_CORS_ORIGINS=*
      - DEFAULT_INFERENCE_TIMEOUT_SECONDS=60
      - DEFAULT_PROVIDER_TIMEOUT_SECONDS=45
    volumes:
      - ./Model_service:/app
    depends_on:
      model_mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  model_mariadb_data:
